# A deployment that crash-loops: the app needs DATABASE_URL, the pod spec sets only DATABASE_HOST (from a ConfigMap).
# The evidence is in the previous run's log, the last exit code and the BackOff events; the fix is one env entry.
# kubectl --context orbstack apply -f deploy/scenarios/crashloop.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: landlens-dev
  labels: { app.kubernetes.io/part-of: landlens-scenarios }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
  namespace: landlens-dev
data:
  DATABASE_HOST: orders-db.landlens-dev.svc.cluster.local
  DATABASE_NAME: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: landlens-dev
  labels: { app: orders-api, scenario: crashloop }
spec:
  replicas: 1
  selector: { matchLabels: { app: orders-api } }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "orders-api 2.4.1 starting"
              echo "config: DATABASE_HOST=${DATABASE_HOST} DATABASE_NAME=${DATABASE_NAME}"
              if [ -z "${DATABASE_URL}" ]; then
                echo "FATAL: DATABASE_URL is not set; refusing to start without a database" >&2
                exit 1
              fi
              echo "listening on :8080"; sleep 3600
          envFrom:
            - configMapRef: { name: orders-api-config }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
