# A pod no node can take: it asks for a node label (landlens.dev/pool=gpu-a100) that no node has. Nothing about the nodes is changed.
# node deploy/scenarios/doctor/up.mjs (all of them), or kubectl --context orbstack -n landlens-dev apply -f this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-trainer
  namespace: landlens-dev
  labels: { app: gpu-trainer, scenario: doctor }
spec:
  replicas: 1
  selector: { matchLabels: { app: gpu-trainer } }
  template:
    metadata:
      labels: { app: gpu-trainer, scenario: doctor }
    spec:
      terminationGracePeriodSeconds: 1
      nodeSelector: { landlens.dev/pool: gpu-a100 }
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
