# Never ready: the app listens on 8080, the readiness probe checks 8081.
# node deploy/scenarios/doctor/up.mjs (all of them), or kubectl --context orbstack -n landlens-dev apply -f this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: landlens-dev
  labels: { app: cart-api, scenario: doctor }
spec:
  replicas: 1
  selector: { matchLabels: { app: cart-api } }
  template:
    metadata:
      labels: { app: cart-api, scenario: doctor }
    spec:
      terminationGracePeriodSeconds: 1

      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo listening on :8080; while true; do echo ok | nc -l -p 8080; done"]
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
