# Stuck in ContainerCreating: it mounts the ConfigMap invoice-templates, which doesn't exist (FailedMount events). Below it, a claim for a storage class that doesn't exist (ProvisioningFailed events).
# node deploy/scenarios/doctor/up.mjs (all of them), or kubectl --context orbstack -n landlens-dev apply -f this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-renderer
  namespace: landlens-dev
  labels: { app: invoice-renderer, scenario: doctor }
spec:
  replicas: 1
  selector: { matchLabels: { app: invoice-renderer } }
  template:
    metadata:
      labels: { app: invoice-renderer, scenario: doctor }
    spec:
      terminationGracePeriodSeconds: 1
      volumes:
        - name: templates
          configMap: { name: invoice-templates }
      containers:
        - name: renderer
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts: [{ name: templates, mountPath: /templates }]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invoice-archive
  namespace: landlens-dev
  labels: { scenario: doctor }
spec:
  storageClassName: landlens-missing
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Mi }
