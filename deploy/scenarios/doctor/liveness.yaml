# Killed and restarted by its liveness probe: it checks /tmp/alive, which the app never creates.
# node deploy/scenarios/doctor/up.mjs (all of them), or kubectl --context orbstack -n landlens-dev apply -f this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  namespace: landlens-dev
  labels: { app: search-indexer, scenario: doctor }
spec:
  replicas: 1
  selector: { matchLabels: { app: search-indexer } }
  template:
    metadata:
      labels: { app: search-indexer, scenario: doctor }
    spec:
      terminationGracePeriodSeconds: 1

      containers:
        - name: indexer
          image: busybox:1.36
          command: ["sh", "-c", "echo indexing; sleep 3600"]
          livenessProbe:
            exec: { command: ["cat", "/tmp/alive"] }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
