apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/part-of: landlens-scenarios, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sh", "-c", "while true; do echo \"$MESSAGE\"; sleep 5; done"]
          env:
            - name: MESSAGE
              valueFrom: { configMapKeyRef: { name: {{ .Release.Name }}, key: message } }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
