apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  labels: { app.kubernetes.io/part-of: landlens-scenarios, app.kubernetes.io/instance: {{ .Release.Name }} }
type: Opaque
data:
  password: {{ .Values.auth.adminPassword | b64enc | quote }}
stringData:
  api-key: {{ .Values.auth.apiKey | quote }}
